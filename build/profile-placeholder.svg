<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="person" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Person icon -->
  <circle cx="200" cy="140" r="60" fill="url(#person)" opacity="0.9"/>
  <path d="M 200 220 Q 120 220 80 300 L 80 400 L 320 400 L 320 300 Q 280 220 200 220" fill="url(#person)" opacity="0.9"/>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="80" r="4" fill="#00f0ff" opacity="0.6"/>
  <circle cx="320" cy="80" r="4" fill="#a855f7" opacity="0.6"/>
  <circle cx="80" cy="320" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="320" cy="320" r="4" fill="#00f0ff" opacity="0.6"/>
</svg>